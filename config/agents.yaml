system:
  defaultProvider: anthropic
  defaultBudgetLane: balanced
  credentials:
    googleEnv: SYSTEM_GOOGLE_API_KEY
    openaiEnv: SYSTEM_OPENAI_API_KEY
    # Reads the ANTHROPIC_API_KEY in the local .env (the standard Anthropic var).
    anthropicEnv: ANTHROPIC_API_KEY

lanes:
  fast:
    defaultProvider: anthropic
  balanced:
    defaultProvider: anthropic
  high_quality:
    defaultProvider: anthropic

agents:
  default:
    fast:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 8192
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
  agent.interviewer:
    fast:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 4096
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 4096
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 4096
  agent.writer:
    fast:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 8192
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
  agent.dnd_expert:
    fast:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 8192
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
  agent.layout_expert:
    fast:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 8192
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
  agent.critic:
    fast:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 8192
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
  agent.final_editor:
