      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 8192
    balanced:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
    high_quality:
      provider: anthropic
      model: claude-sonnet-4-6
      maxOutputTokens: 16384
  # Artist stays on Gemini — Anthropic has no image generation capability
  agent.artist:
    fast:
      provider: google
      model: gemini-2.5-flash-image
      maxOutputTokens: 2048
    balanced:
      provider: google
      model: gemini-2.5-flash-image
      maxOutputTokens: 2048
    high_quality:
      provider: google
      model: gemini-3.1-flash-image-preview
      maxOutputTokens: 2048
  agent.artist_console:
